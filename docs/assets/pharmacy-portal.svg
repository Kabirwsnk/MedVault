  <text x="56" y="519" fill="#10b981" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="700">ATOMIC DISPENSING GUARANTEE:</text>
  <text x="274" y="519" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Row-level locks (SELECT FOR UPDATE) on both Prescription and Medicine rows prevent race conditions and negative inventory under concurrent dispense operations.</text>
</svg>
