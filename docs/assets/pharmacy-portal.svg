  <text x="530" y="412" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="700">15</text>
  <text x="590" y="412" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">1 tab PRN · 3 days</text>
  <rect x="760" y="400" width="60" height="20" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
  <text x="770" y="414" fill="#fbbf24" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10.5" font-weight="700">PENDING</text>
  <rect x="860" y="396" width="96" height="28" rx="5" fill="#10b981"/>
  <text x="874" y="414" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11.5" font-weight="600">Dispense Stock</text>

  <!-- Table Row 3 (Dispensed Record) -->
  <text x="56" y="462" fill="#64748b" font-family="monospace" font-size="12">#099</text>
  <text x="130" y="462" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Pooja Kulkarni</text>
  <text x="310" y="462" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Metformin 500mg</text>
  <rect x="435" y="448" width="52" height="18" rx="4" fill="#334155"/>
  <text x="442" y="461" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10">Tablet</text>
  <text x="530" y="462" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">20</text>
  <text x="590" y="462" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">1 tab OD with breakfast</text>
  <rect x="760" y="450" width="68" height="20" rx="4" fill="#10b981" fill-opacity="0.15"/>
  <text x="768" y="464" fill="#34d399" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10.5" font-weight="700">DISPENSED</text>
  <text x="880" y="464" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Audited ✓</text>

