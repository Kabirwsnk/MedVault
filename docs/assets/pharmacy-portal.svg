  <text x="68" y="102" fill="#ef4444" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12.5" font-weight="700">Critical Stock Warning</text>
  <text x="214" y="102" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11.5">Atorvastatin 10mg (8 units remaining) · Cetirizine 10mg (15 units remaining)</text>
