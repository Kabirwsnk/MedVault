  <circle cx="28" cy="30" r="14" fill="#10b981" fill-opacity="0.2"/>
  <path d="M28 22v16M20 30h16" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <text x="52" y="36" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="17" font-weight="700">MedVault</text>
  <rect x="136" y="21" width="130" height="20" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3"/>
  <text x="146" y="35" fill="#34d399" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10.5" font-weight="600">PHARMACY DISPENSARY</text>

