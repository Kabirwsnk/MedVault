  <text x="130" y="412" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="600">Aarav Sharma</text>
  <text x="310" y="412" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="500">Paracetamol 650mg</text>
